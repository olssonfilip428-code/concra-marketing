<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .sig {
    display: flex;
    align-items: center;
    gap: 24px;
    border-left: 3px solid #c8a96e;
    padding-left: 20px;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #111;
  }
  .divider {
    width: 1px;
    height: 40px;
    background: #e0e0e0;
  }
  .info {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .name {
    font-size: 13px;
    font-weight: 600;
    color: #111;
    letter-spacing: 0.02em;
  }
  .title {
    font-size: 11px;
    color: #888;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .contact {
    margin-top: 4px;
    font-size: 11px;
    color: #666;
  }
  .contact a {
    color: #c8a96e;
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="sig">
  <div class="logo">CONCRA</div>
  <div class="divider"></div>
  <div class="info">
    <div class="name">Filip</div>
    <div class="title">Grundare &amp; VD</div>
    <div class="contact">
      <a href="mailto:info@concra.se">info@concra.se</a>
      &nbsp;·&nbsp;
      <a href="https://concra.se">concra.se</a>
    </div>
  </div>
</div>
</body>
</html>
